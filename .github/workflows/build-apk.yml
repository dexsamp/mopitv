name: Build MoppiTV Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Universal Debug & Release APKs (Android 5.0 - Android 16)
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MoppiTV-Universal-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk MoppiTV-Universal-Debug.apk

      - name: Upload MoppiTV Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MoppiTV-Universal-Release-APK
          path: MoppiTV-Universal-Release.apk

      - name: Upload MoppiTV Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoppiTV-Universal-Debug-APK
          path: MoppiTV-Universal-Debug.apk
